<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEFEB"/>
      <stop offset="55%" stop-color="#FDF2F7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA843" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#FFBE65" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD68A" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="sunDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB852"/>
      <stop offset="100%" stop-color="#FF9336"/>
    </linearGradient>
    <linearGradient id="fadeToWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="120" fill="url(#skyGrad)"/>

  <!-- Sun with warm atmospheric glow -->
  <circle cx="318" cy="52" r="34" fill="url(#sunGlow)"/>
  <circle cx="318" cy="52" r="22" fill="url(#sunDisc)"/>

  <!-- Distant Clouds -->
  <path d="M40 38 Q52 30 68 34 Q82 32 90 40 Q98 42 100 48 L35 48 Q35 42 40 38 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M220 32 Q230 26 244 30 Q255 28 262 34 Q268 36 270 42 L215 42 Q215 36 220 32 Z" fill="#FFFFFF" opacity="0.5"/>

  <!-- Background Buildings (Layer 1 - Soft Muted Rose/Mauve) -->
  <g fill="#EAA0B8" opacity="0.45">
    <rect x="15" y="42" width="22" height="78" rx="2"/>
    <rect x="42" y="30" width="18" height="90" rx="2"/>
    <rect x="68" y="48" width="26" height="72" rx="2"/>
    <rect x="100" y="36" width="20" height="84" rx="2"/>
    <rect x="135" y="24" width="24" height="96" rx="2"/>
    <rect x="175" y="44" width="18" height="76" rx="2"/>
    <rect x="202" y="32" width="28" height="88" rx="2"/>
    <rect x="245" y="40" width="20" height="80" rx="2"/>
    <rect x="278" y="26" width="22" height="94" rx="2"/>
    <rect x="330" y="42" width="24" height="78" rx="2"/>
    <rect x="362" y="35" width="26" height="85" rx="2"/>
  </g>

  <!-- Midground Buildings (Layer 2 - Warm Rose/Plum) -->
  <g fill="#DA7290" opacity="0.75">
    <rect x="0" y="62" width="20" height="58" rx="2"/>
    <rect x="25" y="50" width="22" height="70" rx="2"/>
    <rect x="52" y="38" width="16" height="82" rx="2"/>
    <!-- Spire on tall mid building -->
    <line x1="60" y1="24" x2="60" y2="38" stroke="#DA7290" stroke-width="2"/>
    <rect x="74" y="58" width="30" height="62" rx="2"/>
    <rect x="110" y="46" width="24" height="74" rx="2"/>
    <rect x="145" y="54" width="18" height="66" rx="2"/>
    <rect x="170" y="34" width="26" height="86" rx="2"/>
    <!-- Dome / curved top -->
    <path d="M170 34 Q183 24 196 34 Z" fill="#DA7290"/>
    <rect x="210" y="50" width="22" height="70" rx="2"/>
    <rect x="238" y="58" width="26" height="62" rx="2"/>
    <rect x="270" y="44" width="16" height="76" rx="2"/>
    <rect x="292" y="52" width="32" height="68" rx="2"/>
    <rect x="338" y="48" width="20" height="72" rx="2"/>
    <rect x="370" y="56" width="30" height="64" rx="2"/>
  </g>

  <!-- Foreground Buildings (Layer 3 - Rich Warm Sunset Berry) -->
  <g fill="#C45174">
    <rect x="8" y="70" width="22" height="50" rx="2"/>
    <rect x="35" y="60" width="24" height="60" rx="2"/>
    <rect x="64" y="66" width="18" height="54" rx="2"/>
    <rect x="88" y="52" width="28" height="68" rx="2"/>
    <!-- Stepped rooftop -->
    <rect x="94" y="44" width="16" height="8" rx="1"/>
    <line x1="102" y1="36" x2="102" y2="44" stroke="#C45174" stroke-width="2"/>
    <rect x="122" y="64" width="20" height="56" rx="2"/>
    <rect x="150" y="58" width="28" height="62" rx="2"/>
    <rect x="184" y="68" width="22" height="52" rx="2"/>
    <rect x="214" y="60" width="24" height="60" rx="2"/>
    <rect x="244" y="66" width="20" height="54" rx="2"/>
    <rect x="272" y="56" width="30" height="64" rx="2"/>
    <rect x="310" y="62" width="26" height="58" rx="2"/>
    <rect x="344" y="58" width="24" height="62" rx="2"/>
    <rect x="375" y="68" width="25" height="52" rx="2"/>

    <!-- Subtle warm architectural window lights -->
    <g fill="#FFECA8" opacity="0.65">
      <rect x="42" y="68" width="3" height="4" rx="0.5"/>
      <rect x="48" y="68" width="3" height="4" rx="0.5"/>
      <rect x="42" y="76" width="3" height="4" rx="0.5"/>
      <rect x="48" y="76" width="3" height="4" rx="0.5"/>

      <rect x="96" y="58" width="3" height="4" rx="0.5"/>
      <rect x="104" y="58" width="3" height="4" rx="0.5"/>
      <rect x="96" y="66" width="3" height="4" rx="0.5"/>
      <rect x="104" y="66" width="3" height="4" rx="0.5"/>

      <rect x="156" y="66" width="3" height="4" rx="0.5"/>
      <rect x="164" y="66" width="3" height="4" rx="0.5"/>
      <rect x="156" y="74" width="3" height="4" rx="0.5"/>
      <rect x="164" y="74" width="3" height="4" rx="0.5"/>

      <rect x="280" y="64" width="3" height="4" rx="0.5"/>
      <rect x="288" y="64" width="3" height="4" rx="0.5"/>
      <rect x="280" y="72" width="3" height="4" rx="0.5"/>
      <rect x="288" y="72" width="3" height="4" rx="0.5"/>

      <rect x="350" y="66" width="3" height="4" rx="0.5"/>
      <rect x="358" y="66" width="3" height="4" rx="0.5"/>
      <rect x="350" y="74" width="3" height="4" rx="0.5"/>
      <rect x="358" y="74" width="3" height="4" rx="0.5"/>
    </g>
  </g>

  <!-- Ground Accent Bar -->
  <rect x="0" y="106" width="400" height="14" fill="#A83E5E" opacity="0.3"/>

  <!-- Soft Gradient Feather into Card Surface -->
  <rect x="0" y="85" width="400" height="35" fill="url(#fadeToWhite)"/>
</svg>
