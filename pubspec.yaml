name: hrms
description: "Internal HRMS mobile app (Android/iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  share_plus: ^13.3.0
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  postgres: ^3.5.17

flutter:
